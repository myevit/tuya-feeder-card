name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code dist/tuya-feeder-card.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 scripts/check_public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: test-results/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: myevit/tuya-feeder
          ref: main
          path: .contract-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: pip install -r requirements_test.txt
        working-directory: .contract-integration
      - run: git rev-parse HEAD && git -C .contract-integration rev-parse HEAD
      - run: pytest -c pyproject.toml -q ${{ github.workspace }}/tests/ha_contract.py
        working-directory: .contract-integration
        env:
          PYTHONPATH: ${{ github.workspace }}/.contract-integration/tests:${{ github.workspace }}/.contract-integration
          TUYA_FEEDER_CARD_DIR: ${{ github.workspace }}
